name: Upstream Sync

# 設定觸發條件
on:
  schedule:
    - cron: '0 2 * * *' # 每天 UTC 時間 02:00 執行一次 (可自行修改)
  workflow_dispatch: # 允許你在 GitHub 網頁上手動點擊執行

jobs:
  sync_with_upstream:
    runs-on: ubuntu-latest
    name: Sync main with upstream
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4

      - name: Sync upstream changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # 使用 GitHub 官方 CLI 進行同步
        run: |
          gh repo sync ${{ github.repository }} -b main
          # 注意：如果你的預設分支是 master 或其他名稱，請把上面的 main 換掉
